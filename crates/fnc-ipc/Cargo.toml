[package]
name = "fnc-ipc"
description = "Fennec IPC: native named-pipe protocol and the Everything 1.4 WM_COPYDATA compatibility layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fnc-core.workspace = true
fnc-index.workspace = true
fnc-query.workspace = true
fnc-exec.workspace = true
fnc-props = { path = "../fnc-props", default-features = false }
interprocess.workspace = true
serde.workspace = true
rmp-serde.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }

[lints]
workspace = true
