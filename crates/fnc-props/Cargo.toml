[package]
name = "fnc-props"
description = "Fennec property, content, hash and duplicate extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["extract"]
# File parsers (image/EXIF/audio/video/PE/OOXML/PDF, text decoding). Without it the crate is
# the property/content model, the stores and the hash cache only (what `fnc-query` needs).
extract = [
    "dep:image",
    "dep:kamadak-exif",
    "dep:lofty",
    "dep:mp4parse",
    "dep:zip",
    "dep:quick-xml",
    "dep:encoding_rs",
    "dep:chardetng",
    "dep:miniz_oxide",
]

[dependencies]
fnc-core = { path = "../fnc-core" }
fnc-index = { path = "../fnc-index" }
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true
memchr.workspace = true
chrono.workspace = true
rayon.workspace = true
regex.workspace = true
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
crc32fast = "1.5"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
# extract
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tga", "tiff", "webp"], optional = true }
kamadak-exif = { version = "0.6", optional = true }
lofty = { version = "0.25", optional = true }
mp4parse = { version = "0.17", optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
quick-xml = { version = "0.41", optional = true }
encoding_rs = { version = "0.8", optional = true }
chardetng = { version = "1", optional = true }
miniz_oxide = { version = "0.9", optional = true }

[dev-dependencies]
tempfile.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
miniz_oxide = "0.9"

[lints]
workspace = true
