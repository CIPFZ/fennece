name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Bench smoke
        env:
          FENNEC_BENCH_ENTRIES: "20000"
        run: cargo bench -p bench -- --test
      - name: Baseline report (small fixture)
        env:
          FENNEC_BENCH_ENTRIES: "100000"
          FENNEC_BENCH_RUNS: "5"
        run: cargo run --release -p bench --bin bench-report

  windows-cross-check:
    name: clippy (x86_64-pc-windows-msvc from Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # `bench` is excluded: criterion pulls `alloca`, whose C build needs MSVC (covered by windows-latest).
      - run: cargo clippy --workspace --exclude bench --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
