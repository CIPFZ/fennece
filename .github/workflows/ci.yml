name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        # Failing tests become annotations (visible on the run page without the raw log).
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log || {
            grep -E '^test .* FAILED$|panicked at|^error' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Bench smoke
        env:
          FENNEC_BENCH_ENTRIES: "20000"
        run: cargo bench -p bench -- --test
      - name: Baseline report (small fixture)
        env:
          FENNEC_BENCH_ENTRIES: "100000"
          FENNEC_BENCH_RUNS: "5"
        run: cargo run --release -p bench --bin bench-report

  windows-cross-check:
    name: clippy (x86_64-pc-windows-msvc from Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Excluded: `bench` (criterion pulls `alloca`, whose C build needs MSVC) and the semantic
      # crates (llama.cpp's CMake build cannot cross-compile to MSVC); windows-latest covers them.
      - shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude bench --exclude fnc-semantic --exclude sem-eval --all-targets \
            --target x86_64-pc-windows-msvc --no-default-features -- -D warnings 2>&1 | tee clippy.log || {
            grep -E '^(error|warning)' clippy.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
