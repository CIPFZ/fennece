# cargo-deny: licence and vulnerability policy (AGENT.md M0, SPEC ch.6 §6).

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error (unmaintained) is only reachable through tray-icon's GTK backend, which is
    # never built: tray-icon is a Windows-only dependency of fnc-app.
    { id = "RUSTSEC-2024-0370", reason = "Linux-only transitive dependency of tray-icon; not compiled" },
    # paste (unmaintained, not a vulnerability) is a compile-time proc-macro of lofty (audio tags);
    # replacing lofty is out of scope for 0.2.0 (AGENT.md iron rule 11).
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro used only at build time by lofty" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
]

[[licenses.clarify]]
crate = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
deny = [
    # Prefer the pure-Rust zlib backends already in the tree.
    { crate = "openssl-sys", reason = "no C TLS stacks; HTTP uses rustls if TLS is ever needed" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
